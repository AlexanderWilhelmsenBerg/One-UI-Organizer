name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: APK variant to build
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.workflow }}-${{ github.ref }}-${{ inputs.variant }}
  cancel-in-progress: true

jobs:
  debug:
    name: Build signed debug APK
    if: inputs.variant == 'debug'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Gradle without persistent cache
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-disabled: true

      - name: Provision API 37.0 compile SDK
        shell: bash
        run: |
          set -euo pipefail

          tools_dir="${RUNNER_TEMP}/android-command-line-tools"
          tools_zip="${RUNNER_TEMP}/commandlinetools-linux-15859902_latest.zip"
          android_cli="${tools_dir}/cmdline-tools/bin/android"
          api37_package="platforms/android-37.0@2.0.0"

          mkdir -p "${tools_dir}"
          curl -fsSL \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            -o "${tools_zip}"
          unzip -q "${tools_zip}" -d "${tools_dir}"

          echo "Android command-line tools archive: commandlinetools-linux-15859902_latest.zip"
          echo "Android CLI version:"
          "${android_cli}" --no-metrics --version
          echo "Installing only ${api37_package} from the beta channel."
          "${android_cli}" --no-metrics --sdk="${ANDROID_HOME}" sdk install --force "${api37_package}" --beta

          test -f "${ANDROID_HOME}/platforms/android-37.0/android.jar"
          cat "${ANDROID_HOME}/platforms/android-37.0/source.properties"
          "${ANDROID_HOME}/platform-tools/adb" --version
          "${ANDROID_HOME}/platform-tools/adb" --version | grep -F "Version 37.0.1"

      - name: Report toolchains
        run: |
          ./gradlew --version
          ./gradlew javaToolchains --warning-mode=fail --dependency-verification=strict

      - name: Validate distribution signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured in the release environment."
            exit 1
          fi
          if [[ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD is not configured in the release environment."
            exit 1
          fi

      - name: Reconstruct distribution keystore
        id: keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore_path="${RUNNER_TEMP}/one-ui-organizer-upload.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          chmod 600 "${keystore_path}"
          test -s "${keystore_path}"
          echo "path=${keystore_path}" >> "${GITHUB_OUTPUT}"

      - name: Build signed debug APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: >-
          ./gradlew :app:assembleDebug
          --warning-mode=fail
          --dependency-verification=strict
          --configuration-cache
          --configuration-cache-problems=fail

      - name: Verify debug APK signature
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "${apk}"

          apksigner="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "${apksigner}"
          echo "Using apksigner: ${apksigner}"
          "${apksigner}" verify --verbose --print-certs "${apk}"

      - name: Prepare debug APK artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "${source_apk}"

          short_sha="${GITHUB_SHA::7}"
          target_apk="${RUNNER_TEMP}/OneUIOrganizer-debug-${short_sha}.apk"
          cp "${source_apk}" "${target_apk}"
          test -s "${target_apk}"

          filename="$(basename "${target_apk}")"
          size_bytes="$(stat -c '%s' "${target_apk}")"
          size_human="$(numfmt --to=iec --suffix=B "${size_bytes}")"
          sha256="$(sha256sum "${target_apk}" | awk '{print $1}')"

          echo "apk_path=${target_apk}" >> "${GITHUB_OUTPUT}"
          echo "filename=${filename}" >> "${GITHUB_OUTPUT}"
          echo "size_bytes=${size_bytes}" >> "${GITHUB_OUTPUT}"
          echo "size_human=${size_human}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"

      - name: Upload debug APK directly
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.package.outputs.apk_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Write debug APK summary
        shell: bash
        run: |
          {
            echo "### Signed debug APK"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Variant | debug |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Filename | \`${{ steps.package.outputs.filename }}\` |"
            echo "| Size | ${{ steps.package.outputs.size_human }} (${{ steps.package.outputs.size_bytes }} bytes) |"
            echo "| SHA-256 | \`${{ steps.package.outputs.sha256 }}\` |"
            echo "| Artifact service digest | \`${{ steps.upload.outputs.artifact-digest }}\` |"
            echo "| Download | [${{ steps.package.outputs.filename }}](${{ steps.upload.outputs.artifact-url }}) |"
            echo
            echo "This GitHub-hosted debug APK is signed with the same permanent distribution key as release builds."
            echo "Signature verification passed before upload; certificate details/fingerprint are in the verification step log."
            echo "Uploaded as a direct single-file artifact with \`archive: false\`; retention is 14 days."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/one-ui-organizer-upload.jks"

  release:
    name: Build signed release APK
    if: inputs.variant == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Gradle without persistent cache
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-disabled: true

      - name: Provision API 37.0 compile SDK
        shell: bash
        run: |
          set -euo pipefail

          tools_dir="${RUNNER_TEMP}/android-command-line-tools"
          tools_zip="${RUNNER_TEMP}/commandlinetools-linux-15859902_latest.zip"
          android_cli="${tools_dir}/cmdline-tools/bin/android"
          api37_package="platforms/android-37.0@2.0.0"

          mkdir -p "${tools_dir}"
          curl -fsSL \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            -o "${tools_zip}"
          unzip -q "${tools_zip}" -d "${tools_dir}"

          echo "Android command-line tools archive: commandlinetools-linux-15859902_latest.zip"
          echo "Android CLI version:"
          "${android_cli}" --no-metrics --version
          echo "Installing only ${api37_package} from the beta channel."
          "${android_cli}" --no-metrics --sdk="${ANDROID_HOME}" sdk install --force "${api37_package}" --beta

          test -f "${ANDROID_HOME}/platforms/android-37.0/android.jar"
          cat "${ANDROID_HOME}/platforms/android-37.0/source.properties"
          "${ANDROID_HOME}/platform-tools/adb" --version
          "${ANDROID_HOME}/platform-tools/adb" --version | grep -F "Version 37.0.1"

      - name: Report toolchains
        run: |
          ./gradlew --version
          ./gradlew javaToolchains --warning-mode=fail --dependency-verification=strict

      - name: Validate release signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured in the release environment."
            exit 1
          fi
          if [[ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD is not configured in the release environment."
            exit 1
          fi

      - name: Reconstruct release keystore
        id: keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore_path="${RUNNER_TEMP}/one-ui-organizer-upload.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          chmod 600 "${keystore_path}"
          test -s "${keystore_path}"
          echo "path=${keystore_path}" >> "${GITHUB_OUTPUT}"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: >-
          ./gradlew :app:assembleRelease
          --warning-mode=fail
          --dependency-verification=strict
          --configuration-cache
          --configuration-cache-problems=fail

      - name: Verify release APK signature
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "${apk}"

          apksigner="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "${apksigner}"
          echo "Using apksigner: ${apksigner}"
          "${apksigner}" verify --verbose --print-certs "${apk}"

      - name: Prepare release APK artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/release/app-release.apk"
          test -f "${source_apk}"

          short_sha="${GITHUB_SHA::7}"
          target_apk="${RUNNER_TEMP}/OneUIOrganizer-release-${short_sha}.apk"
          cp "${source_apk}" "${target_apk}"
          test -s "${target_apk}"

          filename="$(basename "${target_apk}")"
          size_bytes="$(stat -c '%s' "${target_apk}")"
          size_human="$(numfmt --to=iec --suffix=B "${size_bytes}")"
          sha256="$(sha256sum "${target_apk}" | awk '{print $1}')"

          echo "apk_path=${target_apk}" >> "${GITHUB_OUTPUT}"
          echo "filename=${filename}" >> "${GITHUB_OUTPUT}"
          echo "size_bytes=${size_bytes}" >> "${GITHUB_OUTPUT}"
          echo "size_human=${size_human}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"

      - name: Upload release APK directly
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.package.outputs.apk_path }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Write release APK summary
        shell: bash
        run: |
          {
            echo "### Signed release APK"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Variant | release |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Filename | \`${{ steps.package.outputs.filename }}\` |"
            echo "| Size | ${{ steps.package.outputs.size_human }} (${{ steps.package.outputs.size_bytes }} bytes) |"
            echo "| SHA-256 | \`${{ steps.package.outputs.sha256 }}\` |"
            echo "| Artifact service digest | \`${{ steps.upload.outputs.artifact-digest }}\` |"
            echo "| Download | [${{ steps.package.outputs.filename }}](${{ steps.upload.outputs.artifact-url }}) |"
            echo
            echo "Signature verification passed before upload. The certificate details/fingerprint are in the verification step log."
            echo "Uploaded as a direct single-file artifact with \`archive: false\`; retention is 14 days."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/one-ui-organizer-upload.jks"
