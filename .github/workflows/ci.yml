name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up JDK
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '26'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;37.0.0"

      - name: Build and quality gates
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.warning.mode=fail
        run: |
          set -euo pipefail
          ./gradlew \
            --stacktrace \
            --warning-mode=fail \
            --dependency-verification=strict \
            assembleDebug \
            assembleDebugAndroidTest \
            testDebugUnitTest \
            lintDebug \
            ktlintCheck \
            buildHealth

      - name: Verify dependency analysis is clean
        shell: bash
        run: |
          set -euo pipefail
          report_file="app/build/reports/dependency-analysis/build-health-report.txt"
          if [[ ! -f "$report_file" ]]; then
            echo "Dependency analysis report was not created: $report_file" >&2
            exit 1
          fi
          if grep -Eq '^[[:space:]]*(Advice for|Unused dependencies|Used transitive dependencies|Misused dependencies|Redundant plugins)' "$report_file"; then
            cat "$report_file"
            echo "Dependency analysis reported actionable advice." >&2
            exit 1
          fi

      - name: Verify configuration-cache creation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .gradle/configuration-cache
          ./gradlew \
            --stacktrace \
            --warning-mode=fail \
            --dependency-verification=strict \
            --configuration-cache \
            --configuration-cache-problems=fail \
            help \
            2>&1 | tee "${RUNNER_TEMP}/configuration-cache-create.log"
          grep -F "Configuration cache entry stored." "${RUNNER_TEMP}/configuration-cache-create.log"

      - name: Verify configuration-cache reuse
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            --stacktrace \
            --warning-mode=fail \
            --dependency-verification=strict \
            --configuration-cache \
            --configuration-cache-problems=fail \
            help \
            2>&1 | tee "${RUNNER_TEMP}/configuration-cache-reuse.log"
          grep -F "Reusing configuration cache." "${RUNNER_TEMP}/configuration-cache-reuse.log"

      - name: Enforce permission audit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t permissions < <(grep -oE 'android:name="android\.permission\.[A-Z0-9_]+"' app/src/main/AndroidManifest.xml | sed -E 's/.*"(android\.permission\.[A-Z0-9_]+)"/\1/' || true)
          if ! printf '%s\n' "${permissions[@]}" | grep -Fxq 'android.permission.INTERNET'; then
            echo "Metadata enrichment requires the audited INTERNET permission." >&2
            exit 1
          fi
          unexpected=$(printf '%s\n' "${permissions[@]}" | grep -Fxv 'android.permission.INTERNET' || true)
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected Android permission(s) found in manifest:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          if grep -Fq 'android.permission.QUERY_ALL_PACKAGES' app/src/main/AndroidManifest.xml; then
            echo "QUERY_ALL_PACKAGES remains forbidden." >&2
            exit 1
          fi
