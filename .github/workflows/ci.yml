name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Provision API 37.0 compile SDK
        shell: bash
        run: |
          set -euo pipefail

          tools_dir="${RUNNER_TEMP}/android-command-line-tools"
          tools_zip="${RUNNER_TEMP}/commandlinetools-linux-15859902_latest.zip"
          android_cli="${tools_dir}/cmdline-tools/bin/android"
          api37_package="platforms/android-37.0@2.0.0"

          mkdir -p "${tools_dir}"
          curl -fsSL \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            -o "${tools_zip}"
          unzip -q "${tools_zip}" -d "${tools_dir}"

          echo "Android command-line tools archive: commandlinetools-linux-15859902_latest.zip"
          echo "Android CLI version:"
          "${android_cli}" --no-metrics --version
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "API 37 packages visible on beta channel:"
          "${android_cli}" --no-metrics --sdk="${ANDROID_HOME}" sdk list "platforms/android-37.*" --beta --all-versions
          echo "API 37 directories before install:"
          find "${ANDROID_HOME}/platforms" -maxdepth 1 -type d -name 'android-37*' -print 2>/dev/null || true

          echo "Installing only ${api37_package} from the beta channel."
          "${android_cli}" --no-metrics --sdk="${ANDROID_HOME}" sdk install --force "${api37_package}" --beta

          echo "API 37 directories after install:"
          find "${ANDROID_HOME}/platforms" -maxdepth 1 -type d -name 'android-37*' -print
          test -f "${ANDROID_HOME}/platforms/android-37.0/android.jar"
          ls -l "${ANDROID_HOME}/platforms/android-37.0/android.jar"
          echo "Installed API 37.0 source properties:"
          cat "${ANDROID_HOME}/platforms/android-37.0/source.properties"

          echo "Android platform-tools:"
          "${ANDROID_HOME}/platform-tools/adb" --version
          "${ANDROID_HOME}/platform-tools/adb" --version | grep -F "Version 37.0.1"

      - name: Report toolchains
        run: |
          ./gradlew --version
          ./gradlew javaToolchains --warning-mode=fail --dependency-verification=strict

      - name: Clean scaffold
        run: >-
          ./gradlew clean
          --warning-mode=fail
          --dependency-verification=strict
          --configuration-cache
          --configuration-cache-problems=fail

      - name: Verify deterministic build
        run: >-
          ./gradlew :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug :app:ktlintCheck buildHealth
          --warning-mode=fail
          --dependency-verification=strict
          --configuration-cache
          --configuration-cache-problems=fail

      - name: Report dependency health
        shell: bash
        run: |
          set -euo pipefail
          report="build/reports/dependency-analysis/build-health-report.txt"
          test -f "${report}"
          cat "${report}"

      - name: Verify configuration-cache reuse
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:assembleDebugAndroidTest \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:ktlintCheck \
            buildHealth \
            --warning-mode=fail \
            --dependency-verification=strict \
            --configuration-cache \
            --configuration-cache-problems=fail \
            2>&1 | tee "${RUNNER_TEMP}/configuration-cache-reuse.log"
          grep -F "Reusing configuration cache." "${RUNNER_TEMP}/configuration-cache-reuse.log"

      - name: Audit built APK manifest
        shell: bash
        run: |
          set -euo pipefail
          apkanalyzer="$(find "${ANDROID_HOME}/cmdline-tools" -type f -path '*/bin/apkanalyzer' -print -quit)"
          test -n "${apkanalyzer}"
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -f "${apk}"
          "${apkanalyzer}" manifest print "${apk}" > "${RUNNER_TEMP}/merged-debug-manifest.xml"
          python3 .github/scripts/audit_apk_manifest.py "${RUNNER_TEMP}/merged-debug-manifest.xml"

      - name: Upload verification reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-reports-${{ github.sha }}
          path: |
            app/build/reports
            app/build/test-results
            build/reports
          if-no-files-found: ignore
          retention-days: 7

  instrumentation:
    name: Android instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Provision API 37.0 compile SDK
        shell: bash
        run: |
          set -euo pipefail

          tools_dir="${RUNNER_TEMP}/android-command-line-tools"
          tools_zip="${RUNNER_TEMP}/commandlinetools-linux-15859902_latest.zip"
          android_cli="${tools_dir}/cmdline-tools/bin/android"
          api37_package="platforms/android-37.0@2.0.0"

          mkdir -p "${tools_dir}"
          curl -fsSL \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            -o "${tools_zip}"
          unzip -q "${tools_zip}" -d "${tools_dir}"
          "${android_cli}" --no-metrics --sdk="${ANDROID_HOME}" sdk install --force "${api37_package}" --beta
          test -f "${ANDROID_HOME}/platforms/android-37.0/android.jar"

      - name: Enable KVM access
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation suite
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: >-
            ./gradlew connectedDebugAndroidTest
            --warning-mode=fail
            --dependency-verification=strict

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumentation-reports-${{ github.sha }}
          path: |
            app/build/outputs/androidTest-results
            app/build/reports/androidTests
          if-no-files-found: ignore
          retention-days: 7
