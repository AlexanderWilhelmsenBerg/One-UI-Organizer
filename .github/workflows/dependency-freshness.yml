name: Dependency freshness

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: dependency-freshness
  cancel-in-progress: true

jobs:
  report:
    name: Stable dependency update report
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Run stable dependency discovery
        run: >-
          ./gradlew dependencyUpdates
          --warning-mode=fail
          --dependency-verification=strict

      - name: Publish dependency report summary
        shell: bash
        run: |
          set -euo pipefail
          report="build/dependencyUpdates/report.txt"
          test -f "${report}"
          cat "${report}"
          {
            echo '### Stable dependency freshness'
            echo
            echo 'This workflow is advisory and intentionally separate from deterministic PR CI.'
            echo
            echo '```text'
            sed -n '1,220p' "${report}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload dependency report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-freshness-${{ github.sha }}
          path: build/dependencyUpdates/report.txt
          if-no-files-found: error
          retention-days: 14
