name: Refresh Verification Metadata

on:
  push:
    branches:
      - foundation/scaffold

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Add toolchain-resolution checksums
        run: >-
          ./gradlew javaToolchains
          --write-verification-metadata sha256
          --warning-mode=fail

      - name: Commit verification metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          if git diff --cached --quiet; then
            echo "No verification metadata changes were needed."
            exit 1
          fi
          git commit -m "build: verify toolchain resolution metadata"
          git push
